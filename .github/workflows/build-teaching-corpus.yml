name: Build teaching corpus

on:
  pull_request:
    paths:
      - "data/**"
      - "scripts/**"
      - "tests/**"
      - "references/**"
      - "SKILL.md"
      - "skill.json"
      - "adapters/**"
      - ".github/workflows/build-teaching-corpus.yml"
  push:
    branches: [main]
    paths-ignore:
      - "generated/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Rebuild portable recipe index
        run: python scripts/build_recipe_index.py

      - name: Build full teaching corpus
        run: python scripts/build_teaching_corpus.py

      - name: Show manifest
        run: cat generated/manifest.json

      - name: Reject agent-specific absolute paths
        shell: bash
        run: |
          if grep -R -n -E '/Users/|/home/runner/|\.claude/skills' references/recipe_index.json generated/; then
            echo "Found non-portable absolute/runtime-specific paths"
            exit 1
          fi

      - name: Commit generated portable data on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references/recipe_index.json generated/
          if git diff --cached --quiet; then
            echo "Generated data is already up to date."
          else
            git commit -m "chore: regenerate portable cooking data [skip ci]"
            git push
          fi
